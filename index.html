<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Patatap Clone — Interactive Vector Graphics & Sound Matrix</title>
	<meta name="description" content="Interactive kinetic vector audio-visual web synthesizer inspired by Patatap. Built using Paper.js and Howler.js.">

	<!-- Libraries -->
	<script type="text/javascript" src="paper-full.js"></script>
	<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>

	<!-- Styles -->
	<link rel="stylesheet" type="text/css" href="circles.css">

	<!-- PaperScript Canvas Engine -->
	<script type="text/paperscript" canvas="myCanvas">
		var isMuted = false;
		var shapes = [];
		var count = 0;

		var keyData = {
			q: { sound: new Howl({ src: ['sounds/bubbles.mp3'] }), color: '#1abc9c' },
			w: { sound: new Howl({ src: ['sounds/clay.mp3'] }), color: '#2ecc71' },
			e: { sound: new Howl({ src: ['sounds/confetti.mp3'] }), color: '#3498db' },
			r: { sound: new Howl({ src: ['sounds/corona.mp3'] }), color: '#9b59b6' },
			t: { sound: new Howl({ src: ['sounds/dotted-spiral.mp3'] }), color: '#34495e' },
			y: { sound: new Howl({ src: ['sounds/flash-1.mp3'] }), color: '#16a085' },
			u: { sound: new Howl({ src: ['sounds/flash-2.mp3'] }), color: '#27ae60' },
			i: { sound: new Howl({ src: ['sounds/flash-3.mp3'] }), color: '#2980b9' },
			o: { sound: new Howl({ src: ['sounds/glimmer.mp3'] }), color: '#8e44ad' },
			p: { sound: new Howl({ src: ['sounds/moon.mp3'] }), color: '#2c3e50' },
			a: { sound: new Howl({ src: ['sounds/pinwheel.mp3'] }), color: '#f1c40f' },
			s: { sound: new Howl({ src: ['sounds/piston-1.mp3'] }), color: '#e67e22' },
			d: { sound: new Howl({ src: ['sounds/piston-2.mp3'] }), color: '#e74c3c' },
			f: { sound: new Howl({ src: ['sounds/prism-1.mp3'] }), color: '#95a5a6' },
			g: { sound: new Howl({ src: ['sounds/prism-2.mp3'] }), color: '#f39c12' },
			h: { sound: new Howl({ src: ['sounds/prism-3.mp3'] }), color: '#d35400' },
			j: { sound: new Howl({ src: ['sounds/splits.mp3'] }), color: '#1abc9c' },
			k: { sound: new Howl({ src: ['sounds/squiggle.mp3'] }), color: '#2ecc71' },
			l: { sound: new Howl({ src: ['sounds/strike.mp3'] }), color: '#3498db' },
			z: { sound: new Howl({ src: ['sounds/suspension.mp3'] }), color: '#9b59b6' },
			x: { sound: new Howl({ src: ['sounds/timer.mp3'] }), color: '#34495e' },
			c: { sound: new Howl({ src: ['sounds/ufo.mp3'] }), color: '#16a085' },
			v: { sound: new Howl({ src: ['sounds/veil.mp3'] }), color: '#27ae60' },
			b: { sound: new Howl({ src: ['sounds/wipe.mp3'] }), color: '#2980b9' },
			n: { sound: new Howl({ src: ['sounds/zig-zag.mp3'] }), color: '#8e44ad' },
			m: { sound: new Howl({ src: ['sounds/moon.mp3'] }), color: '#e056fd' }
		};

		var keyList = Object.keys(keyData);

		function triggerShape(key, point) {
			if (!keyData[key]) return;

			var targetPoint = point || (Point.random() * new Point(view.size.width, view.size.height));
			var radius = Math.min(view.size.width, view.size.height) * 0.38;

			// Alternate between circles and polygon shapes for visual richness
			var shape;
			var variant = Math.floor(Math.random() * 3);
			if (variant === 0) {
				shape = new Path.Circle(targetPoint, radius);
			} else if (variant === 1) {
				shape = new Path.RegularPolygon(targetPoint, 3 + Math.floor(Math.random() * 4), radius * 0.85);
			} else {
				shape = new Path.Rectangle({
					point: targetPoint - new Point(radius * 0.7, radius * 0.7),
					size: [radius * 1.4, radius * 1.4],
					radius: 20
				});
			}

			shape.fillColor = keyData[key].color;
			shape.blendMode = 'screen';
			shape.opacity = 0.95;

			if (!isMuted && keyData[key].sound) {
				keyData[key].sound.play();
			}

			shapes.push(shape);
			count++;

			// Update counter
			var counterEl = document.getElementById('count-val');
			if (counterEl) {
				counterEl.innerText = count;
			}

			// Dismiss initial instruction
			var hint = document.getElementById('instruction');
			if (hint && !hint.classList.contains('fade-out')) {
				hint.classList.add('fade-out');
			}
		}

		function onKeyDown(event) {
			var k = event.key ? event.key.toLowerCase() : '';
			if (keyData[k]) {
				triggerShape(k);
			}
		}

		function onMouseDown(event) {
			var randomKey = keyList[Math.floor(Math.random() * keyList.length)];
			triggerShape(randomKey, event.point);
		}

		function onFrame(event) {
			for (var i = shapes.length - 1; i >= 0; i--) {
				shapes[i].fillColor.hue += 1.5;
				shapes[i].scale(0.92);
				shapes[i].rotate(3.5);
				shapes[i].opacity *= 0.96;

				// Garbage collection: remove shape once shrunk to prevent memory leak
				if (shapes[i].area < 1 || shapes[i].opacity < 0.02) {
					shapes[i].remove();
					shapes.splice(i, 1);
				}
			}
		}

		// Sound mute toggle hook
		window.toggleSound = function() {
			isMuted = !isMuted;
			var btn = document.getElementById('mute-btn');
			if (btn) {
				btn.classList.toggle('muted', isMuted);
				btn.innerHTML = isMuted ? '🔇 Muted' : '🔊 Sound On';
			}
		};
	</script>
</head>
<body>
	<canvas id="myCanvas" resize></canvas>

	<!-- Minimal Glassmorphism HUD -->
	<div class="overlay">
		<header class="header">
			<div class="title-badge">
				<span class="dot"></span>
				<span>Interactive Vector Audio Visualizer</span>
			</div>
			<button id="mute-btn" class="sound-toggle-btn" onclick="window.toggleSound()">
				🔊 Sound On
			</button>
		</header>

		<main id="instruction" class="instruction-container">
			<h1 class="instruction-text">Press any key A &ndash; Z</h1>
			<p class="instruction-subtext">or click / tap anywhere on the screen</p>
		</main>

		<footer class="footer">
			<div>Built with <span style="color:#f43f5e;">♥</span> using <strong>Paper.js</strong> &amp; <strong>Howler.js</strong></div>
			<div class="stats-counter">Triggers: <span id="count-val">0</span></div>
		</footer>
	</div>
</body>
</html>
